<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#071824">
  <title>Florida Man: The Impossible Errand</title>
  <style>
    :root{--night:#071824;--ink:#0a1b28;--cream:#fff4d6;--aqua:#34e7d2;--yellow:#ffd23f;--orange:#ff6b22;--pink:#ff3f79;--lime:#a9ef45}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#030c12;color:#fff;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",Arial,sans-serif;overscroll-behavior:none}
    body{min-height:100dvh;background:radial-gradient(circle at 16% 15%,#16485a 0,transparent 34%),radial-gradient(circle at 84% 80%,#431d3d 0,transparent 36%),#030c12}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .app{width:min(1180px,100%);min-height:100dvh;margin:auto;display:grid;align-content:center;padding:18px}
    .cabinet{position:relative;overflow:hidden;border:4px solid #204858;border-radius:24px;background:#06131c;box-shadow:0 28px 90px #000c,inset 0 0 0 2px #ffffff12}
    .topbar{height:70px;display:grid;grid-template-columns:1.3fr .9fr .9fr 1fr auto;align-items:center;gap:12px;padding:10px 16px;border-bottom:3px solid #02090e;background:linear-gradient(180deg,#103747,#071924);box-shadow:inset 0 -2px 0 #ffffff12}
    .brand{display:grid;line-height:.8;color:var(--cream);font-size:1.4rem;letter-spacing:.01em;text-shadow:0 3px 0 #000}.brand span{color:var(--yellow);font-size:.76em}
    .stat{display:grid}.stat small{color:#91b8c4;font:800 .65rem Arial;letter-spacing:.13em}.stat strong{font-size:1.3rem;line-height:1.1}
    .mission-stat strong{overflow:hidden;max-width:240px;color:var(--aqua);font:900 .86rem/1.15 Arial;white-space:nowrap;text-overflow:ellipsis}
    .icon-btn{width:44px;height:44px;border:2px solid #ffffff65;border-radius:11px;color:#fff;background:#ffffff10;box-shadow:0 4px 0 #02090e;font-size:1.1rem}
    .screen-wrap{position:relative;aspect-ratio:16/9;background:#000}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
    .toast{position:absolute;z-index:8;left:50%;top:18px;max-width:75%;padding:9px 16px;border:2px solid #fff;border-radius:8px;color:var(--ink);background:var(--yellow);box-shadow:0 5px 0 #9f470f,0 10px 24px #0007;font:900 .92rem Arial;text-align:center;transform:translate(-50%,-130%);transition:transform .22s cubic-bezier(.2,.8,.3,1.25)}
    .toast.show{transform:translate(-50%,0)}
    .overlay{position:absolute;z-index:20;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#02090e77,#02090eea);backdrop-filter:blur(3px)}
    .overlay.hidden{display:none}
    .card{width:min(660px,94%);padding:24px 28px 28px;border:4px solid var(--yellow);border-radius:18px;background:radial-gradient(circle at 50% 0,#15536a 0,transparent 45%),#071824;box-shadow:0 12px 0 #02080c,0 28px 70px #000c;text-align:center}
    .tape{display:inline-block;margin-bottom:10px;padding:6px 12px;color:var(--ink);background:repeating-linear-gradient(135deg,var(--yellow) 0 12px,#ffab20 12px 24px);border:2px solid #111;font:900 .7rem Arial;letter-spacing:.11em;transform:rotate(-2deg)}
    .card h1{margin:4px 0 10px;color:var(--cream);font-size:clamp(2.7rem,7vw,5rem);line-height:.78;letter-spacing:-.035em;text-shadow:0 5px 0 #031018,0 9px 0 var(--pink)}
    .card h1 span{color:var(--yellow);font-size:.75em}.card h2{margin:6px 0 8px;color:var(--cream);font-size:clamp(2.1rem,6vw,3.5rem);line-height:.9;text-shadow:0 4px 0 var(--pink)}
    .card p{max-width:540px;margin:14px auto;color:#d8e8ed;font:800 1rem/1.4 Arial}.card .story{color:#fff;font-size:1.05rem}
    .mission-box{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin:18px 0;padding:12px;border:2px solid #ffffff35;border-radius:11px;background:#02090e77;text-align:left}.mission-box b{font:3rem "Apple Color Emoji","Segoe UI Emoji",sans-serif}.mission-box span{display:grid;color:var(--aqua);font:900 .77rem Arial;letter-spacing:.08em}.mission-box strong{margin-top:3px;color:#fff;font:900 1rem/1.2 Arial}
    .big-btn{width:100%;padding:15px 18px;border:0;border-radius:11px;color:var(--ink);background:linear-gradient(180deg,var(--yellow),#ff9d20);box-shadow:0 6px 0 #9f3b0b;font-size:1.05rem;letter-spacing:.05em}.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9f3b0b}
    .small-link{margin-top:16px;border:0;color:#bfd2d8;background:transparent;font:800 .8rem Arial;text-decoration:underline}
    .controls{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px;padding:13px 16px 16px;border-top:3px solid #02090e;background:linear-gradient(180deg,#0a2632,#06151e)}
    .controls button{min-height:70px;display:grid;place-items:center;border:2px solid #ffffffb8;border-radius:14px;color:#fff;background:linear-gradient(180deg,#1a5668,#0b2a37);box-shadow:0 6px 0 #02090e,inset 0 1px 0 #ffffff30}.controls button:active,.controls button.down{transform:translateY(4px);box-shadow:0 2px 0 #02090e;background:#1c667a}.controls b{font-size:1.65rem;line-height:1}.controls small{font:900 .64rem Arial;letter-spacing:.13em}.controls .jump{color:var(--ink);border-color:#fff;background:linear-gradient(180deg,var(--lime),#58c748);box-shadow:0 6px 0 #1a6928}.controls .jump:active,.controls .jump.down{box-shadow:0 2px 0 #1a6928;background:#8fe746}
    .rotate-note{display:none;padding:8px;color:#bdd2d9;font:700 .75rem Arial;text-align:center;background:#041017}
    .legend{padding-top:9px;color:#7899a4;font:700 .74rem Arial;text-align:center;letter-spacing:.04em}
    @media(max-width:760px){.app{padding:0;display:block}.cabinet{min-height:100dvh;border:0;border-radius:0}.topbar{height:62px;padding:8px 10px;grid-template-columns:1fr .72fr .72fr auto}.mission-stat{display:none}.brand{font-size:1.1rem}.stat strong{font-size:1.05rem}.screen-wrap{aspect-ratio:16/9}.controls{padding:10px;gap:8px}.controls button{min-height:68px}.legend{display:none}.rotate-note{display:block}.card{padding:18px}.card p{font-size:.9rem}.mission-box{margin:12px 0}}
    @media(max-height:500px) and (orientation:landscape){.app{padding:0}.cabinet{border:0;border-radius:0}.topbar{height:52px}.screen-wrap{height:calc(100dvh - 124px);aspect-ratio:auto}.controls{position:absolute;z-index:12;left:0;right:0;bottom:8px;padding:0 12px;border:0;background:transparent;pointer-events:none}.controls button{min-height:60px;opacity:.82;pointer-events:auto}.rotate-note,.legend{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <section class="cabinet">
      <header class="topbar">
        <div class="brand">FLORIDA MAN<span>THE IMPOSSIBLE ERRAND</span></div>
        <div class="stat"><small>HEALTH</small><strong id="health">♥ ♥ ♥</strong></div>
        <div class="stat"><small>ORANGES</small><strong id="oranges">🍊 0</strong></div>
        <div class="stat mission-stat"><small>LOCATION</small><strong id="location">MIAMI BEACH</strong></div>
        <button class="icon-btn" id="sound" aria-label="Mute sound">🔊</button>
      </header>

      <div class="screen-wrap">
        <canvas id="game" width="960" height="540" aria-label="Florida Man side-scrolling platform game"></canvas>
        <div class="toast" id="toast"></div>
        <div class="overlay" id="overlay"></div>
      </div>

      <nav class="controls" aria-label="Game controls">
        <button id="left" aria-label="Move left"><b>◀</b><small>RUN LEFT</small></button>
        <button id="right" aria-label="Move right"><b>▶</b><small>RUN RIGHT</small></button>
        <button class="jump" id="jump" aria-label="Jump"><b>⬆</b><small>JUMP / DOUBLE JUMP</small></button>
      </nav>
      <div class="rotate-note">For the full old-school experience, turn your phone sideways.</div>
    </section>
    <div class="legend">Keyboard: A/D or ←/→ to run · W, ↑, or Space to jump · P to pause · R to restart</div>
  </main>

  <script>
  (function(){
    "use strict";
    var canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),W=960,H=540;
    ctx.imageSmoothingEnabled=false;
    var overlay=document.getElementById("overlay"),toast=document.getElementById("toast");
    var keys={left:false,right:false},mode="title",stage=0,world,camera=0,last=0,clock=0,muted=false,toastTimer=0;
    var score=0,totalOranges=0,runTime=0,checkpoint={x:80,y:300};
    var player={x:80,y:300,w:34,h:54,vx:0,vy:0,onGround:false,coyote:0,jumps:0,jumpBuffer:0,health:3,invuln:0,coffee:0,shield:0,facing:1,runFrame:0};
    var STAGES=[
      {name:"MIAMI BEACH",title:"OCEAN DRIVE DASH",mission:"Carry the emergency Publix sub across Ocean Drive and reach the waiting airboat.",theme:"miami",width:4700,time:95,goal:"AIRBOAT RENDEZVOUS"},
      {name:"THE EVERGLADES",title:"SWAMP EXPRESS",mission:"Cross the Everglades, dodge wildlife, and reach the Seven Mile Bridge pickup.",theme:"glades",width:5000,time:105,goal:"BRIDGE PICKUP"},
      {name:"KEY WEST",title:"SUNSET SHOWDOWN",mission:"Reach Mallory Square, defeat HOA Karen, and deliver the sub before sunset.",theme:"keys",width:5100,time:120,goal:"MALLORY SQUARE"}
    ];
    var inputButtons=[["left","left"],["right","right"]];
    var supplies=["orange","orange","orange","coffee","spf"];

    function rectsTouch(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
    function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
    function rnd(a,b){return a+Math.random()*(b-a)}
    function tone(freq,len,type){
      if(muted)return;
      try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;window._gameAudio=window._gameAudio||new A();var c=window._gameAudio,o=c.createOscillator(),g=c.createGain();o.type=type||"square";o.frequency.setValueAtTime(freq,c.currentTime);g.gain.setValueAtTime(.04,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+len);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+len)}catch(e){}
    }
    function showToast(text,color){
      toast.textContent=text;toast.style.background=color||"var(--yellow)";toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.classList.remove("show")},1900)
    }
    function p(x,y,w,h,type){return{x:x,y:y,w:w,h:h,type:type||"ground",baseX:x,baseY:y,t:Math.random()*6}}
    function enemy(x,y,type,left,right){return{x:x,y:y,w:type==="mosquito"?30:48,h:type==="karen"?72:30,type:type,left:left||x-80,right:right||x+110,dir:1,speed:type==="karen"?90:type==="mosquito"?75:48,alive:true,hp:type==="karen"?5:1,inv:0,throwClock:0}}
    function item(x,y,type){return{x:x,y:y,w:28,h:28,type:type,taken:false,bob:Math.random()*6}}
    function spike(x,y,w,type){return{x:x,y:y,w:w,h:20,type:type||"spike"}}

    function makeWorld(i){
      var platforms=[],items=[],enemies=[],hazards=[],springs=[],signs=[];
      if(i===0){
        platforms=[
          p(0,455,760,85),p(850,455,650,85),p(1590,425,680,115),p(2370,455,720,85),p(3190,430,650,110),p(3940,455,760,85),
          p(410,350,180,20,"awning"),p(1060,335,170,20,"awning"),p(1800,315,190,20,"awning"),p(2610,345,180,20,"awning"),p(3380,300,190,20,"awning"),p(4200,335,180,20,"awning"),
          p(1450,365,95,16,"moving"),p(3070,350,100,16,"moving")
        ];
        platforms[platforms.length-2].move={axis:"x",range:105,speed:1.4};platforms[platforms.length-1].move={axis:"y",range:80,speed:1.7};
        hazards=[spike(730,438,30,"cone"),spike(1510,500,80,"water"),spike(2268,500,102,"water"),spike(3090,500,100,"water"),spike(3840,500,100,"water")];
        springs=[{x:680,y:423,w:38,h:32},{x:2220,y:393,w:38,h:32},{x:3780,y:398,w:38,h:32}];
        enemies=[enemy(610,423,"iguana",510,690),enemy(1120,423,"scooter",920,1430),enemy(1910,393,"gator",1680,2210),enemy(2750,423,"scooter",2440,3020),enemy(3500,398,"iguana",3250,3780),enemy(4300,423,"gator",4020,4580)];
        signs=[{x:220,text:"OCEAN DRIVE →"},{x:2350,text:"SOUTH BEACH: STILL CHAOTIC"},{x:4220,text:"AIRBOAT THIS WAY"}];
      }else if(i===1){
        platforms=[
          p(0,455,520,85),p(650,425,360,115,"mud"),p(1130,455,520,85),p(1770,405,380,135,"mud"),p(2280,455,590,85),p(2990,415,460,125,"mud"),p(3570,455,560,85),p(4250,420,750,120,"mud"),
          p(535,380,105,18,"log"),p(1015,340,105,18,"log"),p(1655,345,105,18,"log"),p(2165,310,105,18,"log"),p(2880,350,105,18,"log"),p(3460,310,105,18,"log"),p(4140,350,105,18,"log")
        ];
        [8,10,12].forEach(function(n,k){platforms[n].type="moving";platforms[n].move={axis:k===1?"y":"x",range:k===1?75:95,speed:1.2+k*.25}});
        hazards=[spike(520,500,130,"swamp"),spike(1010,500,120,"swamp"),spike(1650,500,120,"swamp"),spike(2150,500,130,"swamp"),spike(2870,500,120,"swamp"),spike(3450,500,120,"swamp"),spike(4130,500,120,"swamp")];
        springs=[{x:450,y:423,w:38,h:32},{x:1570,y:423,w:38,h:32},{x:2800,y:423,w:38,h:32},{x:4040,y:423,w:38,h:32}];
        enemies=[enemy(360,423,"gator",160,470),enemy(760,393,"gator",680,950),enemy(1250,423,"mosquito",1170,1570),enemy(1910,373,"gator",1810,2070),enemy(2500,423,"gator",2340,2780),enemy(3170,383,"mosquito",3040,3390),enemy(3780,423,"gator",3630,4050),enemy(4530,388,"gator",4320,4890)];
        signs=[{x:180,text:"EVERGLADES NATIONAL PARK"},{x:2240,text:"DO NOT FEED GATORS"},{x:4500,text:"KEY WEST: 127 MILES"}];
      }else{
        platforms=[
          p(0,450,650,90,"bridge"),p(760,410,620,130,"bridge"),p(1500,450,520,90,"bridge"),p(2140,395,640,145,"bridge"),p(2900,450,560,90,"bridge"),p(3580,410,650,130,"bridge"),p(4340,450,760,90,"street"),
          p(560,335,120,18,"boat"),p(1380,315,120,18,"boat"),p(2020,330,120,18,"boat"),p(2780,300,120,18,"boat"),p(3460,330,120,18,"boat"),p(4230,320,110,18,"boat")
        ];
        [7,9,11].forEach(function(n,k){platforms[n].type="moving";platforms[n].move={axis:k===1?"x":"y",range:k===1?95:70,speed:1.35+k*.2}});
        hazards=[spike(650,500,110,"ocean"),spike(1380,500,120,"ocean"),spike(2020,500,120,"ocean"),spike(2780,500,120,"ocean"),spike(3460,500,120,"ocean"),spike(4230,500,110,"ocean")];
        springs=[{x:590,y:418,w:38,h:32},{x:1960,y:418,w:38,h:32},{x:3390,y:418,w:38,h:32}];
        enemies=[enemy(410,418,"rooster",160,590),enemy(940,378,"rooster",800,1320),enemy(1670,418,"iguana",1530,1960),enemy(2350,363,"rooster",2190,2710),enemy(3100,418,"iguana",2940,3380),enemy(3900,378,"rooster",3640,4180),enemy(4560,378,"karen",4430,4880)];
        signs=[{x:190,text:"WELCOME TO THE KEYS"},{x:2300,text:"7 MILE BRIDGE(ISH)"},{x:4370,text:"MALLORY SQUARE"}];
      }
      var ledges=platforms.filter(function(q){return q.y<440});
      platforms.forEach(function(q,idx){
        if(idx%2===0)items.push(item(q.x+Math.min(q.w-55,95),q.y-48,"orange"));
        if(q.w>500){items.push(item(q.x+q.w*.48,q.y-62,"orange"));items.push(item(q.x+q.w*.72,q.y-48,"orange"))}
      });
      ledges.forEach(function(q,idx){if(idx%2===0)items.push(item(q.x+q.w/2,q.y-48,idx%4===0?"coffee":"orange"))});
      items.push(item(1850,stage===1?270:270,"spf"));items.push(item(3350,stage===2?250:260,"coffee"));
      return{platforms:platforms,items:items,enemies:enemies,hazards:hazards,springs:springs,signs:signs,projectiles:[],goal:{x:STAGES[i].width-105,y:340,w:60,h:110},time:STAGES[i].time,bossDefeated:i<2};
    }

    function resetPlayer(){
      player.x=checkpoint.x;player.y=checkpoint.y;player.vx=0;player.vy=0;player.onGround=false;player.coyote=0;player.jumps=0;player.jumpBuffer=0;player.invuln=80;camera=clamp(player.x-250,0,STAGES[stage].width-W)
    }
    function loadStage(i,showCard){
      stage=i;world=makeWorld(i);checkpoint={x:80,y:300};resetPlayer();document.getElementById("location").textContent=STAGES[i].name;updateHud();
      if(showCard)stageCard();else mode="playing"
    }
    function updateHud(){
      document.getElementById("health").textContent="♥ ".repeat(player.health).trim()||"—";
      document.getElementById("health").style.color=player.health===1?"var(--pink)":"#fff";
      document.getElementById("oranges").textContent="🍊 "+totalOranges;
      document.getElementById("location").textContent=STAGES[stage].name
    }
    function titleCard(){
      mode="title";
      overlay.classList.remove("hidden");
      overlay.innerHTML='<section class="card"><div class="tape">⚠ EXTREMELY IMPORTANT FLORIDA BUSINESS ⚠</div><h1>FLORIDA MAN<br><span>THE IMPOSSIBLE ERRAND</span></h1><p class="story">The Key West sunset party is in danger. Only one hero is reckless enough to carry an emergency Publix sub from Miami Beach, across the Everglades, and all the way to Mallory Square.</p><div class="mission-box"><b>🥪</b><span>YOUR MISSION<strong>Deliver the legendary sub. Keep the gators away from it.</strong></span></div><button class="big-btn" id="start">BEGIN THE ERRAND ▶</button><p>Run, jump, double-jump, stomp enemies, hit checkpoints, and collect Florida oranges.</p></section>';
      document.getElementById("start").onclick=newGame
    }
    function stageCard(){
      mode="card";var s=STAGES[stage];overlay.classList.remove("hidden");
      overlay.innerHTML='<section class="card"><div class="tape">STAGE '+(stage+1)+' OF 3 · '+s.name+'</div><h2>'+s.title+'</h2><div class="mission-box"><b>'+(stage===0?"🏖️":stage===1?"🐊":"🌅")+'</b><span>MISSION<strong>'+s.mission+'</strong></span></div><button class="big-btn" id="go">LET\'S GO!</button></section>';
      document.getElementById("go").onclick=function(){overlay.classList.add("hidden");mode="playing";last=performance.now();tone(520,.12)}
    }
    function newGame(){
      score=0;totalOranges=0;runTime=0;clock=0;player.health=3;player.coffee=0;player.shield=0;loadStage(0,true)
    }
    function pause(){
      if(mode!=="playing")return;mode="paused";overlay.classList.remove("hidden");overlay.innerHTML='<section class="card"><div class="tape">TEMPORARY ROADSIDE STOP</div><h2>PAUSED</h2><p>Florida Man is checking whether the sub survived that jump.</p><button class="big-btn" id="resume">RETURN TO THE ERRAND</button><button class="small-link" id="restart">Restart this stage</button></section>';
      document.getElementById("resume").onclick=function(){overlay.classList.add("hidden");mode="playing";last=performance.now()};
      document.getElementById("restart").onclick=function(){loadStage(stage,true)}
    }
    function gameOver(reason){
      mode="over";var high=Math.max(score,Number(localStorage.getItem("florida-platform-high")||0));localStorage.setItem("florida-platform-high",high);
      overlay.classList.remove("hidden");overlay.innerHTML='<section class="card"><div class="tape">LOCAL MAN MAKES HEADLINES</div><h2>ERRAND FAILED</h2><p>'+reason+'</p><div class="mission-box"><b>📰</b><span>FINAL REPORT<strong>'+totalOranges+' oranges · '+Math.floor(score).toLocaleString()+' points</strong></span></div><button class="big-btn" id="again">TRY THE ERRAND AGAIN</button><button class="small-link" id="home">Back to title</button></section>';
      document.getElementById("again").onclick=newGame;document.getElementById("home").onclick=titleCard
    }
    function winGame(){
      mode="won";score+=Math.max(0,Math.floor(1000-runTime*3));var high=Math.max(score,Number(localStorage.getItem("florida-platform-high")||0));localStorage.setItem("florida-platform-high",high);
      overlay.classList.remove("hidden");overlay.innerHTML='<section class="card"><div class="tape">MISSION ACCOMPLISHED</div><h2>THE SUB HAS LANDED</h2><p class="story">Mallory Square is saved. HOA Karen has retreated to Nextdoor. The sunset party will speak of Florida Man\'s double-jump for generations.</p><div class="mission-box"><b>🏆</b><span>FINAL SCORE<strong>'+Math.floor(score).toLocaleString()+' points · '+totalOranges+' oranges · '+Math.floor(runTime)+' seconds</strong></span></div><button class="big-btn" id="again">PLAY THE FULL MISSION AGAIN</button><button class="small-link" id="home">Back to title</button></section>';
      document.getElementById("again").onclick=newGame;document.getElementById("home").onclick=titleCard
    }
    function stageComplete(){
      mode="complete";score+=500+Math.floor(world.time*10);tone(780,.18,"sawtooth");
      overlay.classList.remove("hidden");
      if(stage===2){winGame();return}
      overlay.innerHTML='<section class="card"><div class="tape">STAGE '+(stage+1)+' CLEARED</div><h2>'+STAGES[stage].goal+' REACHED</h2><p>The emergency sub is still mostly intact. That counts as a flawless delivery.</p><div class="mission-box"><b>🍊</b><span>RUN TOTAL<strong>'+totalOranges+' oranges · '+Math.floor(score).toLocaleString()+' points</strong></span></div><button class="big-btn" id="next">CONTINUE TO '+STAGES[stage+1].name+' ▶</button></section>';
      document.getElementById("next").onclick=function(){loadStage(stage+1,true)}
    }
    function queueJump(){if(mode!=="playing")return;player.jumpBuffer=9}
    function hurt(reason){
      if(player.invuln>0)return;
      if(player.shield>0){player.shield=0;player.invuln=55;player.vy=-420;showToast("SPF FORCE FIELD SAVED THE SUB!","#34e7d2");tone(240,.12);return}
      player.health--;updateHud();tone(105,.22);if(navigator.vibrate)navigator.vibrate([60,30,60]);
      if(player.health<=0){gameOver(reason);return}
      showToast(reason+" Checkpoint respawn!","#ff8a72");resetPlayer()
    }
    function collect(it){
      it.taken=true;
      if(it.type==="orange"){totalOranges++;score+=100;showToast(totalOranges%5===0?"ORANGE COMBO! +500":"Florida orange +100");if(totalOranges%5===0)score+=500;tone(650,.06)}
      if(it.type==="coffee"){player.coffee=7;score+=250;showToast("CUBAN COFFEE TURBO: 7 SECONDS!","#a9ef45");tone(820,.12)}
      if(it.type==="spf"){player.shield=1;score+=300;showToast("SPF 9000 FORCE FIELD READY!","#34e7d2");tone(900,.15)}
      updateHud()
    }
    function stomp(e){
      if(e.inv>0)return;e.hp--;e.inv=40;player.vy=-620;score+=e.type==="karen"?500:200;tone(e.type==="karen"?130:420,.1);if(navigator.vibrate)navigator.vibrate(25);
      if(e.hp<=0){e.alive=false;if(e.type==="karen"){world.bossDefeated=true;score+=2000;showToast("HOA KAREN DEFEATED! THE SUNSET IS FREE!","#a9ef45")}else showToast("STOMP! +200")}
      else if(e.type==="karen")showToast("KAREN: "+e.hp+" COMPLAINTS REMAIN","#ff8a72")
    }
    function update(dt,time){
      runTime+=dt;world.time-=dt;if(world.time<=0){gameOver("The sunset party started without the sub.");return}
      player.coffee=Math.max(0,player.coffee-dt);if(player.invuln>0)player.invuln--;
      world.platforms.forEach(function(q){
        if(q.move){q.t+=dt*q.move.speed;if(q.move.axis==="x")q.x=q.baseX+Math.sin(q.t)*q.move.range;else q.y=q.baseY+Math.sin(q.t)*q.move.range}
      });
      var accel=player.coffee>0?2350:1800,max=player.coffee>0?430:285;
      if(keys.left){player.vx-=accel*dt;player.facing=-1}if(keys.right){player.vx+=accel*dt;player.facing=1}
      if(!keys.left&&!keys.right)player.vx*=Math.pow(.8,dt*60);
      player.vx=clamp(player.vx,-max,max);player.x+=player.vx*dt;player.x=clamp(player.x,0,STAGES[stage].width-player.w);
      if(player.onGround){player.coyote=7;player.jumps=0}else player.coyote=Math.max(0,player.coyote-1);
      if(player.jumpBuffer>0)player.jumpBuffer--;
      if(player.jumpBuffer>0&&(player.coyote>0||player.jumps<2)){
        player.vy=player.jumps===1?-680:-760;player.onGround=false;player.coyote=0;player.jumps++;player.jumpBuffer=0;tone(player.jumps===2?560:390,.07);if(player.jumps===2)showToast("EMERGENCY DOUBLE JUMP!")
      }
      var oldBottom=player.y+player.h;player.vy+=2050*dt;player.vy=Math.min(player.vy,1050);player.y+=player.vy*dt;player.onGround=false;
      world.platforms.forEach(function(q){
        if(player.vy>=0&&player.x+player.w>q.x+3&&player.x<q.x+q.w-3&&oldBottom<=q.y+12&&player.y+player.h>=q.y){
          player.y=q.y-player.h;player.vy=0;player.onGround=true
        }
      });
      world.springs.forEach(function(s){
        if(rectsTouch(player,s)&&player.vy>=0){player.y=s.y-player.h;player.vy=-1020;player.onGround=false;player.jumps=1;score+=50;tone(250,.16,"sawtooth");showToast("FLIP-FLOP SPRING!")}
      });
      world.hazards.forEach(function(h){if(rectsTouch(player,h)&&h.type!=="water"&&h.type!=="swamp"&&h.type!=="ocean")hurt("You met a "+h.type+".")});
      if(player.y>H+80)hurt(stage===1?"A gator considered you lunch.":"You went swimming with the sub.");

      world.items.forEach(function(it){if(!it.taken&&rectsTouch(player,it))collect(it)});
      world.enemies.forEach(function(e){
        if(!e.alive)return;if(e.inv>0)e.inv--;e.x+=e.dir*e.speed*dt;if(e.x<e.left){e.x=e.left;e.dir=1}if(e.x>e.right){e.x=e.right;e.dir=-1}
        if(e.type==="mosquito")e.y+=Math.sin(time/180+e.x)*.45;
        if(e.type==="karen"&&Math.abs(e.x-player.x)<650){e.throwClock-=dt;if(e.throwClock<=0){e.throwClock=1.25;world.projectiles.push({x:e.x,y:e.y+18,w:22,h:16,vx:player.x<e.x?-300:300,vy:-80,dead:false});tone(170,.05)}}
        if(rectsTouch(player,e)&&e.inv<=0){
          if(player.vy>150&&oldBottom<=e.y+18){stomp(e)}else hurt(e.type==="karen"?"You received a binding HOA violation.":"A "+e.type+" interrupted the mission.")
        }
      });
      world.projectiles.forEach(function(n){if(n.dead)return;n.x+=n.vx*dt;n.vy+=250*dt;n.y+=n.vy*dt;if(rectsTouch(player,n)){n.dead=true;hurt("A strongly worded violation hit you.")}if(n.y>H+100)n.dead=true});
      world.projectiles=world.projectiles.filter(function(n){return!n.dead});

      if(player.x>1550&&checkpoint.x<1500){checkpoint={x:1600,y:260};showToast("CHECKPOINT: THE SUB IS STILL WARM")}
      if(player.x>3200&&checkpoint.x<3000){checkpoint={x:3240,y:250};showToast("CHECKPOINT: ONLY FLORIDA CAN STOP YOU")}
      if(rectsTouch(player,world.goal)){
        if(stage===2&&!world.bossDefeated)showToast("DEFEAT HOA KAREN TO OPEN MALLORY SQUARE!","#ff8a72");else stageComplete()
      }
      camera+=((clamp(player.x-280,0,STAGES[stage].width-W))-camera)*Math.min(1,dt*6);
      player.runFrame+=Math.abs(player.vx)*dt*.04;clock=time;updateHud()
    }

    function pixelRect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
    function drawPalm(x,y,s){
      ctx.save();ctx.translate(Math.round(x-camera*.45),y);ctx.rotate(-.08);pixelRect(-5,0,10,115*s,"#563723");pixelRect(-8,35*s,16,9*s,"#70472a");
      ctx.fillStyle="#185e45";for(var i=0;i<7;i++){ctx.save();ctx.translate(0,0);ctx.rotate(-1.25+i*.42);ctx.fillRect(0,-5*s,72*s,10*s);ctx.restore()}ctx.fillStyle="#6e4225";ctx.fillRect(-10,-4,8,8);ctx.fillRect(4,-2,8,8);ctx.restore()
    }
    function drawBackground(){
      var s=STAGES[stage],g=ctx.createLinearGradient(0,0,0,H);
      if(s.theme==="miami"){g.addColorStop(0,"#ff8f36");g.addColorStop(.45,"#96517d");g.addColorStop(1,"#1a7482")}
      if(s.theme==="glades"){g.addColorStop(0,"#ffb34f");g.addColorStop(.42,"#607550");g.addColorStop(1,"#173d3b")}
      if(s.theme==="keys"){g.addColorStop(0,"#ff795d");g.addColorStop(.42,"#7a5ca6");g.addColorStop(1,"#197ca1")}
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#ffd968";ctx.beginPath();ctx.arc(770-camera*.03,105,44,0,Math.PI*2);ctx.fill();
      if(s.theme==="miami"){
        ctx.fillStyle="#2d7684";ctx.fillRect(0,315,W,140);for(var x=-100-(camera*.2%220);x<W+200;x+=220){var bh=85+(x%3)*12;pixelRect(x,315-bh,155,bh,"#185366");pixelRect(x+12,315-bh+16,22,38,"#ff8ac3");pixelRect(x+48,315-bh+16,28,38,"#5be5dc");pixelRect(x+92,315-bh+16,38,38,"#ffd661")}
        drawPalm(120,210,1);drawPalm(520,230,.85);drawPalm(900,215,1.05)
      }else if(s.theme==="glades"){
        ctx.fillStyle="#184a42";ctx.fillRect(0,340,W,120);for(var gx=-60-(camera*.18%170);gx<W+170;gx+=170){pixelRect(gx,230,16,120,"#193c35");ctx.fillStyle="#245f48";ctx.beginPath();ctx.arc(gx+8,235,48,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(gx-20,260,37,0,Math.PI*2);ctx.fill()}
        for(var r=0;r<30;r++){var rx=(r*83-camera*.3)%1100;if(rx<0)rx+=1100;pixelRect(rx,390-(r%3)*12,4,70,"#375f37")}
      }else{
        ctx.fillStyle="#168aae";ctx.fillRect(0,320,W,180);ctx.fillStyle="#ffffff36";for(var k=0;k<7;k++)ctx.fillRect((k*180-camera*.25)%1200,350+k*18,120,3);
        for(var hx=-100-(camera*.18%260);hx<W+260;hx+=260){pixelRect(hx,285,175,80,"#f5c178");pixelRect(hx+10,300,155,65,"#45b9b5");pixelRect(hx+30,270,110,18,"#f05b68")}
        drawPalm(210,235,.8);drawPalm(790,225,.9)
      }
      ctx.fillStyle="#ffffffad";for(var c=0;c<6;c++){var cx=((c*240-camera*.08)%1300)-120,cy=55+(c%3)*45;ctx.fillRect(cx,cy,70,16);ctx.fillRect(cx+18,cy-10,55,18)}
    }
    function drawPlatform(q){
      var x=q.x-camera;if(x>W+50||x+q.w<-50)return;
      var top="#67c84d",body="#81502f";
      if(q.type==="awning"){top="#34d7ca";body="#ef5f86"}
      if(q.type==="moving"){top="#ffd23f";body="#e55d2b"}
      if(q.type==="mud"){top="#81a941";body="#4a6532"}
      if(q.type==="log"){top="#b2773e";body="#714326"}
      if(q.type==="bridge"){top="#e9c18b";body="#7a7f88"}
      if(q.type==="boat"){top="#fff0b8";body="#e65750"}
      if(q.type==="street"){top="#d6c9ae";body="#514f55"}
      pixelRect(x,q.y,q.w,9,top);pixelRect(x,q.y+9,q.w,q.h-9,body);
      ctx.fillStyle="#ffffff13";for(var d=12;d<q.w;d+=32)ctx.fillRect(Math.round(x+d),q.y+17,4,Math.min(18,q.h-20))
    }
    function drawHazard(h){
      var x=h.x-camera;if(x>W||x+h.w<0)return;
      if(h.type==="water"||h.type==="ocean"||h.type==="swamp"){pixelRect(x,478,h.w,62,h.type==="swamp"?"#285c43":"#176c91");ctx.fillStyle="#70e1e1";for(var i=0;i<h.w;i+=24)ctx.fillRect(x+i,482+(i%3)*3,14,3)}
      else{for(var n=0;n<h.w;n+=18){ctx.fillStyle="#ff8a23";ctx.beginPath();ctx.moveTo(x+n,458);ctx.lineTo(x+n+9,438);ctx.lineTo(x+n+18,458);ctx.fill()}}
    }
    function drawSpring(s){
      var x=s.x-camera;pixelRect(x,s.y+17,s.w,15,"#ed4b66");pixelRect(x+4,s.y+9,s.w-8,9,"#ffd23f");pixelRect(x+8,s.y,s.w-16,10,"#34e7d2")
    }
    function drawItem(it){
      if(it.taken)return;var x=it.x-camera,y=it.y+Math.sin(clock*4+it.bob)*5;
      if(it.type==="orange"){ctx.fillStyle="#ff8a22";ctx.beginPath();ctx.arc(x+14,y+14,12,0,Math.PI*2);ctx.fill();pixelRect(x+14,y,8,5,"#58a83f");pixelRect(x+7,y+10,5,5,"#ffc35a")}
      if(it.type==="coffee"){pixelRect(x+5,y+3,18,25,"#efe5d2");pixelRect(x+8,y+7,12,16,"#6d351f");pixelRect(x+22,y+9,7,12,"#efe5d2");pixelRect(x+9,y-2,3,6,"#fff");pixelRect(x+17,y-4,3,8,"#fff")}
      if(it.type==="spf"){pixelRect(x+6,y+5,17,24,"#f5f1dc");pixelRect(x+9,y,11,7,"#34e7d2");pixelRect(x+9,y+12,11,8,"#ff8a22")}
    }
    function drawEnemy(e){
      if(!e.alive)return;var x=e.x-camera,y=e.y,blink=e.inv>0&&e.inv%6<3;if(blink)return;
      if(e.type==="gator"){pixelRect(x,y+10,46,18,"#347f45");pixelRect(x+31,y+2,20,19,"#4a9c4f");pixelRect(x+43,y+5,4,4,"#fff");pixelRect(x+44,y+6,2,2,"#111");pixelRect(x-10,y+14,16,7,"#286139");for(var t=0;t<3;t++)pixelRect(x+34+t*6,y+20,4,4,"#fff")}
      if(e.type==="iguana"){pixelRect(x+6,y+7,35,18,"#63aa47");pixelRect(x+33,y+2,15,17,"#7bc752");pixelRect(x-12,y+13,22,6,"#4b8a39");for(var s=0;s<4;s++){ctx.fillStyle="#ffca42";ctx.beginPath();ctx.moveTo(x+8+s*8,y+7);ctx.lineTo(x+12+s*8,y-2);ctx.lineTo(x+16+s*8,y+7);ctx.fill()}}
      if(e.type==="scooter"){pixelRect(x+22,y-6,5,28,"#2dd7cb");pixelRect(x+8,y+17,32,6,"#2dd7cb");ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x+10,y+25,6,0,7);ctx.arc(x+38,y+25,6,0,7);ctx.fill()}
      if(e.type==="mosquito"){pixelRect(x+13,y+9,5,17,"#211824");pixelRect(x+16,y+3,3,11,"#211824");ctx.strokeStyle="#211824";ctx.beginPath();ctx.moveTo(x+15,y+14);ctx.lineTo(x,y+25);ctx.moveTo(x+18,y+14);ctx.lineTo(x+30,y+25);ctx.stroke();ctx.fillStyle="#ffffff77";ctx.beginPath();ctx.ellipse(x+8,y+8,9,5,-.5,0,7);ctx.ellipse(x+23,y+8,9,5,.5,0,7);ctx.fill()}
      if(e.type==="rooster"){pixelRect(x+13,y+6,24,20,"#f4e8d0");pixelRect(x+30,y,14,15,"#f4e8d0");pixelRect(x+36,y-5,5,6,"#ef4c56");pixelRect(x+42,y+7,8,4,"#ffca42");pixelRect(x+15,y+25,4,8,"#ffca42");pixelRect(x+30,y+25,4,8,"#ffca42");pixelRect(x+3,y+3,13,6,"#2a9466")}
      if(e.type==="karen"){pixelRect(x+13,y+25,39,47,"#e9e0d1");pixelRect(x+17,y+12,31,25,"#e3a270");pixelRect(x+10,y+3,39,16,"#e4d0a5");pixelRect(x+38,y+17,6,5,"#111");pixelRect(x+17,y+17,6,5,"#111");pixelRect(x-3,y+30,20,26,"#ff3f79");ctx.fillStyle="#fff";ctx.font="bold 10px Arial";ctx.fillText("HOA",x,y+47);ctx.fillStyle="#071824";ctx.font="bold 11px Arial";ctx.fillText(e.hp+"!",x+28,y+31)}
    }
    function drawPlayer(){
      if(player.invuln>0&&player.invuln%6<3)return;var x=player.x-camera,y=player.y,bob=player.onGround&&Math.abs(player.vx)>40?Math.sin(player.runFrame)*2:0,leg=Math.sin(player.runFrame)*7;
      ctx.save();ctx.translate(Math.round(x+player.w/2),Math.round(y+bob));if(player.facing<0)ctx.scale(-1,1);
      if(player.shield>0){ctx.strokeStyle="#34e7d2";ctx.lineWidth=4;ctx.globalAlpha=.75;ctx.beginPath();ctx.ellipse(0,27,31,42,0,0,7);ctx.stroke();ctx.globalAlpha=1}
      pixelRect(-12,10,24,21,"#e4a06f");pixelRect(-15,6,30,8,"#174d80");pixelRect(-8,1,20,7,"#ff6b22");pixelRect(2,14,8,5,"#071824");pixelRect(-10,14,8,5,"#071824");pixelRect(10,16,6,3,"#e4a06f");
      pixelRect(-15,30,30,28,"#ff7a22");pixelRect(-4,34,8,16,"#ffd23f");ctx.fillStyle="#071824";ctx.font="bold 10px Arial";ctx.fillText("FL",-6,46);
      pixelRect(-20,33,7,23,"#e4a06f");pixelRect(14,32,7,23,"#e4a06f");pixelRect(-13+leg*.35,56,9,18,"#3871a7");pixelRect(5-leg*.35,56,9,18,"#3871a7");pixelRect(-17+leg*.55,72,17,5,"#25d6ca");pixelRect(3-leg*.55,72,17,5,"#25d6ca");
      pixelRect(17,35,15,12,"#c99557");pixelRect(21,38,10,3,"#4c8e3f");
      ctx.restore()
    }
    function drawGoal(){
      var g=world.goal,x=g.x-camera;if(x>W+100)return;pixelRect(x+26,g.y,8,g.h,"#e5d0a9");ctx.fillStyle=stage===2&&!world.bossDefeated?"#ff3f79":"#ffd23f";ctx.fillRect(x-3,g.y,62,38);ctx.fillStyle="#071824";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.fillText(stage===2&&!world.bossDefeated?"LOCKED":"GOAL",x+28,g.y+23);ctx.textAlign="left";if(stage<2){pixelRect(x+2,g.y+58,52,25,stage===0?"#d94e47":"#36b7a8");ctx.fillStyle="#fff";ctx.font="bold 10px Arial";ctx.fillText(stage===0?"AIRBOAT":"KEYS",x+10,g.y+74)}else{pixelRect(x-8,g.y+56,72,28,"#ee8f4b");ctx.fillStyle="#fff";ctx.font="bold 9px Arial";ctx.fillText("MALLORY",x+7,g.y+74)}}
    function drawSigns(){
      world.signs.forEach(function(s){var x=s.x-camera;if(x<-180||x>W+30)return;pixelRect(x+15,367,7,88,"#6f4828");pixelRect(x,345,Math.max(130,s.text.length*7),34,"#fff0c6");ctx.fillStyle="#0b3140";ctx.font="bold 12px Arial";ctx.fillText(s.text,x+8,366)})
    }
    function drawProjectiles(){
      world.projectiles.forEach(function(n){var x=n.x-camera;pixelRect(x,n.y,n.w,n.h,"#fff4d6");pixelRect(x+3,n.y+4,n.w-6,2,"#ff3f79");pixelRect(x+3,n.y+9,n.w-8,2,"#071824")})
    }
    function draw(){
      drawBackground();world.platforms.forEach(drawPlatform);world.hazards.forEach(drawHazard);drawSigns();world.springs.forEach(drawSpring);world.items.forEach(drawItem);drawGoal();world.enemies.forEach(drawEnemy);drawProjectiles();drawPlayer();
      ctx.fillStyle="#071824cc";ctx.fillRect(12,12,225,50);ctx.fillStyle="#34e7d2";ctx.font="bold 12px Arial";ctx.fillText("STAGE "+(stage+1)+"/3 · "+STAGES[stage].name,22,31);ctx.fillStyle="#fff";ctx.font="bold 15px Arial";ctx.fillText("TIME "+Math.max(0,Math.ceil(world.time))+"   SCORE "+Math.floor(score),22,53);
      if(player.coffee>0){ctx.fillStyle="#a9ef45";ctx.fillRect(246,12,128,24);ctx.fillStyle="#071824";ctx.font="bold 12px Arial";ctx.fillText("☕ TURBO "+Math.ceil(player.coffee)+"s",256,29)}
      if(stage===2&&!world.bossDefeated){ctx.fillStyle="#ff3f79";ctx.fillRect(W-238,12,226,28);ctx.fillStyle="#fff";ctx.font="bold 12px Arial";ctx.fillText("BOSS: STOMP KAREN 5×",W-222,31)}
    }
    function loop(t){
      var dt=Math.min(.033,(t-last)/1000||0);last=t;if(mode==="playing")update(dt,t);draw();requestAnimationFrame(loop)
    }
    inputButtons.forEach(function(pair){
      var el=document.getElementById(pair[0]),key=pair[1];
      function down(e){e.preventDefault();keys[key]=true;el.classList.add("down")}
      function up(e){e.preventDefault();keys[key]=false;el.classList.remove("down")}
      el.addEventListener("pointerdown",down);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);el.addEventListener("pointerleave",up)
    });
    var jumpBtn=document.getElementById("jump");
    jumpBtn.addEventListener("pointerdown",function(e){e.preventDefault();jumpBtn.classList.add("down");queueJump()});
    ["pointerup","pointercancel","pointerleave"].forEach(function(n){jumpBtn.addEventListener(n,function(){jumpBtn.classList.remove("down")})});
    addEventListener("keydown",function(e){
      if(["ArrowLeft","ArrowRight","ArrowUp"," ","KeyA","KeyD","KeyW"].indexOf(e.key)>=0)e.preventDefault();
      if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=true;
      if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=true;
      if((e.key==="ArrowUp"||e.key===" "||e.key.toLowerCase()==="w")&&!e.repeat)queueJump();
      if(e.key.toLowerCase()==="p"){mode==="playing"?pause():null}
      if(e.key.toLowerCase()==="r"&&mode!=="title")loadStage(stage,true)
    });
    addEventListener("keyup",function(e){if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false});
    document.getElementById("sound").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊";this.setAttribute("aria-label",muted?"Turn sound on":"Mute sound")};
    canvas.addEventListener("pointerdown",function(){if(mode==="playing")queueJump()});
    loadStage(0,false);titleCard();requestAnimationFrame(loop)
  })();
  </script>
